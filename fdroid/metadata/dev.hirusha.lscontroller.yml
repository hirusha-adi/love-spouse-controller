MaintainerNotes: |-
  This is an offline controller for intimate hardware, intended for adults.
  There is no explicit imagery, proprietary companion-app dependency, or network service.
  Please review the adult-device use case against the inclusion policy.
  The v2.1 tag must be published with these changes before this recipe can build.

